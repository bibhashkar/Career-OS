# A generic, single database configuration for Alembic migrations.

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Prepend the directory of the alembic.ini file to sys.path
prepend_sys_path = .
path_separator = os

# Use os.pathsep to separate paths in version_locations
version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
