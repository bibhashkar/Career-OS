name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: career_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d career_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9dc71ac62889a057b20dd74f1d3ea015  # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check code formatting (ruff format)
        run: |
          ruff format --check backend

      - name: Lint Python codebase (ruff check)
        run: |
          ruff check backend

      - name: Static type analysis (mypy)
        run: |
          mypy backend

      - name: Run test suite with pytest
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/career_os"
          SECRET_KEY: "ci-secret-key-for-testing-only-32chars-min"
          APP_ENV: "test"
        run: |
          pytest backend

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend SPA (Vite)
        working-directory: frontend
        run: |
          npm run build

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build backend Docker image
        run: |
          docker build -t career-os-backend:test ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t career-os-frontend:test ./frontend
